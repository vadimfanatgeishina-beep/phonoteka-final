# ЛР16 (доп.): CI — SAST (Semgrep: правило «токен в логе»), Gitleaks, JVM-тесты, lint, стенды ЛР16 и identity-backend.
name: android-security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Semgrep (token log rule)
        run: |
          pip install semgrep==1.*
          semgrep scan --metrics=off --error --config tools/semgrep-security.yml app/src/main/java
      - name: Gitleaks (history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  java-stands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '22' }
      - run: java tools/lab16/Lab16VariantsTest.java .
      - run: java tools/backend/IdentityServerTest.java
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew
      # Keep R8, lint, and both flavor test compilers out of one Gradle JVM.
      - run: ./gradlew :app:testVulnerableDebugUnitTest :app:testHardenedDebugUnitTest --no-daemon --max-workers=2 --no-parallel
      - run: ./gradlew :app:lintVulnerableDebug :app:lintHardenedDebug --no-daemon --max-workers=2 --no-parallel
      - run: ./gradlew :app:assembleVulnerableRelease :app:assembleHardenedRelease --no-daemon --max-workers=2 --no-parallel
      - run: ./gradlew :app:assembleVulnerableDebugAndroidTest :app:assembleHardenedDebugAndroidTest --no-daemon --max-workers=2 --no-parallel
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
