// Invocation: ./gradlew :app:writeOwnedDependencyComponents --init-script tools/dependency-components.gradle
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeOwnedDependencyComponents') {
        doLast {
            def components = app.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult.allComponents
                .collect { it.id }.findAll { it instanceof ModuleComponentIdentifier }
                .collect { [group: it.group, name: it.module, version: it.version] }
                .unique().sort { a,b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}" }
            def output = new File(gradle.rootProject.projectDir, '.local/evidence/release-components.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(components)) + '\n'
            println "Resolved external dependency components: ${components.size()}"
        }
    }
}
